<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Optimizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>ATS Resume Optimizer</h1>
            <p>Paste your resume and job description to see your match score.</p>
        </header>

        <div class="grid">
            <div class="input-group">
                <label>Job Description</label>
                <textarea id="jobDesc" placeholder="Paste the job requirements here..."></textarea>
            </div>
            <div class="input-group">
                <label>Your Resume</label>
                <textarea id="resumeText" placeholder="Paste your resume text here..."></textarea>
            </div>
        </div>

        <button onclick="optimizeResume()">Analyze & Optimize</button>

        <div id="results" class="hidden">
            <div class="score-card">
                <h3>Match Score: <span id="matchScore">0</span>%</h3>
                <div class="progress-bar"><div id="progressFill"></div></div>
            </div>
            <div class="feedback">
                <h4>Missing Keywords:</h4>
                <ul id="missingKeywords"></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
